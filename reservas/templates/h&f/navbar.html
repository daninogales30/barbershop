{% load static %}
<nav class="navbar" id="navbar">
    <div class="navbar-content">
        <div class="logo">
            DaniBarber
        </div>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="navbar-links" id="navbar-links">
            <a href="{% url 'reservas:home' %}">Inicio</a>
            <a href="{% url 'reservas:servicios' %}">Servicios</a>
            <a href="{% url 'reservas:somos' %}">Quiénes somos</a>
            <a href="{% url 'reservas:contactos' %}">Contacto</a>
            {% if user.is_authenticated %}
                <a href="{% url 'users:perfil' %}" class="perfil-mobile">Mi perfil</a>
            {% endif %}
        </div>
        <div class="auth">
            {% if user.is_authenticated %}
                <a href="{% url 'users:perfil' %}" id="auth-ok">
                    <img src="{{ user.foto_perfil.url }}" alt="Perfil"
                         style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid #c59d5f;">
                </a>
                <a href="{% url 'reservas:crear_reserva' %}" class="enlace">¡Reserva ya!</a>
            {% else %}
                <a href="{% url 'users:login' %}" class="a-login">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<script>
    // Cambiar fondo de navbar al hacer scroll
    window.addEventListener('scroll', function () {
        var navbar = document.getElementById('navbar');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // Botón hamburguesa para móvil
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navbar-links');
    hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        hamburger.classList.toggle('active');
    });
</script>
