{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'reservas/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'reservas/css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'reservas/css/navbar.css' %}">
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
          rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- La navbar va aquí, ANTES del main -->
{% include 'h&f/navbar.html' %}

<main class="container">
    {% block content %}
    {% endblock %}
</main>

{% include 'h&f/footer.html' %}
<script>
    window.addEventListener('scroll', function () {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 100) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });
    window.dispatchEvent(new Event('scroll'));
</script>
</body>
</html>
